font_family Dank Mono
italic_font Dank Mono Italic
font_size 18.0
adjust_line_height 100%

allow_remote_control yes

background #282828
background_opacity 1

window_padding_width 2

hide_window_decorations titlebar-and-corners
macos_traditional_fullscreen yes
macos_quit_when_last_window_closed yes
macos_thicken_font 0.75
mouse_hide_wait 3.0

copy_on_select yes
editor .

cursor_trail 1
cursor_trail_decay 0.15 0.2
cursor_trail_start_threshold 10

color0 #282c34
color1 #cc6666
color2 #87bd68
color3 #dfaf8f
color4 #81a2be
color5 #dc8cc3
color6 #72a0a8
color7 #dcdccc
color8 #709080
color9 #dca3a3
color10 #c3bf9f
color11 #f0dfaf
color12 #94bff3

# --- tmux-style setup -------------------------------------------------------

enabled_layouts splits,stack,tall

# Sessions

map ctrl+a>ctrl+s save_as_session --use-foreground-process --base-dir ~/.config/kitty/sessions
map ctrl+a>m goto_session ~/.config/kitty/sessions
map ctrl+a>ctrl+m goto_session ~/.config/kitty/sessions
map ctrl+a>/ goto_session --sort-by=alphabetical
map ctrl+a>space goto_session -1
map ctrl+a>ctrl+space goto_session -1

# ctrl+a acts as a prefix; ctrl+a ctrl+a sends a literal ctrl+a
map ctrl+a>ctrl+a send_text all \x01

# splits (tmux - | \)
map ctrl+a>minus           launch --location=hsplit --cwd=current
map ctrl+a>shift+backslash launch --location=vsplit --cwd=current
map ctrl+a>backslash       launch --location=vsplit --cwd=current

# tmux windows -> kitty tabs
map ctrl+a>c       new_tab_with_cwd
map ctrl+a>n       next_tab
map ctrl+a>ctrl+n  next_tab
map ctrl+a>shift+n previous_tab
map ctrl+a>1 goto_tab 1
map ctrl+a>2 goto_tab 2
map ctrl+a>3 goto_tab 3
map ctrl+a>4 goto_tab 4
map ctrl+a>5 goto_tab 5

# zoom and layout cycling (tmux = and y)
map ctrl+a>equal toggle_layout stack
map ctrl+a>y     next_layout

# resize
map ctrl+a>right resize_window wider 2
map ctrl+a>left  resize_window narrower 2
map ctrl+a>up    resize_window taller 1
map ctrl+a>down  resize_window shorter 1

# reload, clear scrollback, browse scrollback, sessions
map ctrl+a>r            load_config_file
map ctrl+a>ctrl+l       clear_terminal scrollback active
map ctrl+a>left_bracket show_scrollback

# pane navigation; passed through to nvim when it sets the IS_NVIM user var
macos_option_as_alt yes
map opt+left neighboring_window left
map opt+down neighboring_window down
map opt+up neighboring_window up
map opt+right neighboring_window right
map --when-focus-on var:IS_NVIM opt+left
map --when-focus-on var:IS_NVIM opt+down
map --when-focus-on var:IS_NVIM opt+up
map --when-focus-on var:IS_NVIM opt+right

# Remote control

allow_remote_control yes
listen_on unix:/tmp/mykitty

# --- tab bar (status line), gruvbox powerline -------------------------------

tab_bar_edge bottom
tab_bar_min_tabs 1
tab_bar_style custom
tab_powerline_style slanted
tab_title_template "{index}:{title}{' [Z]' if layout_name == 'stack' else ''}"
active_tab_foreground   #282828
active_tab_background   #d79921
active_tab_font_style   bold
inactive_tab_foreground #a89984
inactive_tab_background #3c3836
inactive_tab_font_style normal
tab_bar_background      #282828
